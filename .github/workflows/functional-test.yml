name: Python Functional Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  run_tests:
    runs-on: [ self-hosted ]
    container: public.ecr.aws/docker/library/python:3.9

    steps:
    - uses: actions/checkout@v5

    - name: Set up uv
      uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5

    - name: Install xmllint
      run: |
        apt-get update
        apt-get install -y libxml2-utils bc

    - name: Install package and run functional tests
      id: run_functional_tests
      shell: bash
      run: |
        source ./dev-setup.sh
        pytest test/functional -s --disable-warnings -v

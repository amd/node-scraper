[project]
name = "amd-node-scraper"
dynamic = ["version"]
description = "Automated data collection and analysis for system debug."
authors = [{ name = "AMD" }]
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

keywords = [
    "amd",
    "debug",
    "diagnostics",
    "dmesg",
    "redfish",
    "scraping",
    "systems",
    "oob",
    "in-band",
]

classifiers = ["Topic :: Software Development"]

dependencies = [
    "pydantic>=2.8.2",
    "paramiko>=3.2.0,<4.0.0",
    "requests",
    "pytz",
    "urllib3>=2.6.0"
]

[project.urls]
homepage = "https://github.com/amd/node-scraper"
documentation = "https://github.com/amd/node-scraper/blob/main/docs/PLUGIN_DOC.md"
repository = "https://github.com/amd/node-scraper"
changelog = "https://github.com/amd/node-scraper/releases"
issues = "https://github.com/amd/node-scraper/issues"

[build-system]
requires = ["setuptools==78.1.1", "setuptools-scm==8.1.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ['nodescraper']

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
nodescraper = ["py.typed"]

[project.scripts]
node-scraper = "nodescraper.cli:cli_entry"

[project.entry-points."nodescraper.plugins"]
AmcRedfishDiagPlugin = "nodescraper.plugins.ooband.amc_redfish_diag.amc_diag_plugin:AmcRedfishDiagPlugin"
AmdSmiFlavorPlugin = "nodescraper.plugins.inband.amdsmi.amdsmi_flavor_plugin:AmdSmiFlavorPlugin"
AmdSmiPlugin = "nodescraper.plugins.inband.amdsmi.amdsmi_plugin:AmdSmiPlugin"
BiosPlugin = "nodescraper.plugins.inband.bios.bios_plugin:BiosPlugin"
CmdlinePlugin = "nodescraper.plugins.inband.cmdline.cmdline_plugin:CmdlinePlugin"
DeviceEnumerationPlugin = "nodescraper.plugins.inband.device_enumeration.device_enumeration_plugin:DeviceEnumerationPlugin"
DimmPlugin = "nodescraper.plugins.inband.dimm.dimm_plugin:DimmPlugin"
DkmsPlugin = "nodescraper.plugins.inband.dkms.dkms_plugin:DkmsPlugin"
DmesgPlugin = "nodescraper.plugins.inband.dmesg.dmesg_plugin:DmesgPlugin"
FabricsPlugin = "nodescraper.plugins.inband.fabrics.fabrics_plugin:FabricsPlugin"
GenericCollectionPlugin = "nodescraper.plugins.generic_collection.inband_plugin:GenericCollectionPlugin"
JournalPlugin = "nodescraper.plugins.inband.journal.journal_plugin:JournalPlugin"
KernelModulePlugin = "nodescraper.plugins.inband.kernel_module.kernel_module_plugin:KernelModulePlugin"
KernelPlugin = "nodescraper.plugins.inband.kernel.kernel_plugin:KernelPlugin"
MemoryPlugin = "nodescraper.plugins.inband.memory.memory_plugin:MemoryPlugin"
Mi4xxServiceabilityPlugin = "nodescraper.plugins.serviceability.mi4xx.serviceability_plugin_mi4xx:Mi4xxServiceabilityPlugin"
NetworkPlugin = "nodescraper.plugins.inband.network.network_plugin:NetworkPlugin"
NicPlugin = "nodescraper.plugins.inband.nic.nic_plugin:NicPlugin"
NvmePlugin = "nodescraper.plugins.inband.nvme.nvme_plugin:NvmePlugin"
OobBmcArchivePlugin = "nodescraper.plugins.ooband.bmc_archive.bmc_archive_plugin:OobBmcArchivePlugin"
OobGenericCollectionPlugin = "nodescraper.plugins.generic_collection.oob_plugin:OobGenericCollectionPlugin"
OsPlugin = "nodescraper.plugins.inband.os.os_plugin:OsPlugin"
PackagePlugin = "nodescraper.plugins.inband.package.package_plugin:PackagePlugin"
PciePlugin = "nodescraper.plugins.inband.pcie.pcie_plugin:PciePlugin"
ProcessPlugin = "nodescraper.plugins.inband.process.process_plugin:ProcessPlugin"
RdmaPlugin = "nodescraper.plugins.inband.rdma.rdma_plugin:RdmaPlugin"
RedfishEndpointPlugin = "nodescraper.plugins.ooband.redfish_endpoint.endpoint_plugin:RedfishEndpointPlugin"
RedfishOemDiagPlugin = "nodescraper.plugins.ooband.redfish_oem_diag.oem_diag_plugin:RedfishOemDiagPlugin"
RegexSearchPlugin = "nodescraper.plugins.inband.regex_search.regex_search_plugin:RegexSearchPlugin"
RocmPlugin = "nodescraper.plugins.inband.rocm.rocm_plugin:RocmPlugin"
ScaleOutAristaPlugin = "nodescraper.plugins.inband.switch.scale_out_arista.scale_out_arista_plugin:ScaleOutAristaPlugin"
ScaleOutDellPlugin = "nodescraper.plugins.inband.switch.scale_out_dell.scale_out_dell_plugin:ScaleOutDellPlugin"
ScaleUpSonicPlugin = "nodescraper.plugins.inband.switch.scale_up_sonic.scale_up_sonic_plugin:ScaleUpSonicPlugin"
ServiceabilityPluginBase = "nodescraper.plugins.serviceability.serviceability_plugin_base:ServiceabilityPluginBase"
ServiceabilityPluginMI3XX = "nodescraper.plugins.serviceability.mi3xx.serviceability_plugin_mi3xx:ServiceabilityPluginMI3XX"
StoragePlugin = "nodescraper.plugins.inband.storage.storage_plugin:StoragePlugin"
SysSettingsPlugin = "nodescraper.plugins.inband.sys_settings.sys_settings_plugin:SysSettingsPlugin"
SysctlPlugin = "nodescraper.plugins.inband.sysctl.sysctl_plugin:SysctlPlugin"
SyslogPlugin = "nodescraper.plugins.inband.syslog.syslog_plugin:SyslogPlugin"
UptimePlugin = "nodescraper.plugins.inband.uptime.uptime_plugin:UptimePlugin"

[project.entry-points."nodescraper.plugin_configs"]
NodeStatus = "nodescraper.pluginrecipe.node_status:NodeStatus"
AllIbPlugins = "nodescraper.pluginrecipe.all_ib_plugins:AllIbPlugins"

[tool.black]
line-length = 100
target_version = ['py39']

[tool.isort]
profile = "black"

[tool.ruff.lint]
select = ["F", "B", "T20", "N", "W", "I", "E"]
ignore = ["E501", "N806"]

[tool.mypy]
python_version = "3.9"
mypy_path = ["test/unit"]
explicit_package_bases = true

[tool.setuptools_scm]
version_scheme = "post-release"

[dependency-groups]
dev = [
    "build",
    "black",
    "pylint",
    "coverage",
    "twine",
    "ruff",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "mypy",
    "types-paramiko",
    "types-requests",
    "types-setuptools",
]
